<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Citas para Uñas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f7f7f7;
        }

        header {
            background-color: #FF69B4;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .appointment-form {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .form-group input[type="submit"] {
            background-color: #FF69B4;
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .form-group input[type="submit"]:hover {
            background-color: #ff4f85;
        }

        .form-group input[type="datetime-local"] {
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <h1>¡Reserva tu Cita para Uñas!</h1>
    </header>

    <div class="appointment-form">
        <h2>Reserva tu Cita</h2>
        <form id="reservationForm">
            <div class="form-group">
                <label for="name">Nombre Completo</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="service">Servicio Seleccionado</label>
                <select id="service" name="service" required>
                    <option value="manicure">Manicure Clásico</option>
                    <option value="pedicure">Pedicure Relajante</option>
                    <option value="nail-art">Uñas Artísticas</option>
                </select>
            </div>
            <div class="form-group">
                <label for="date">Fecha y Hora</label>
                <input type="datetime-local" id="date" name="date" required>
            </div>
            <div class="form-group">
                <label for="phoneNumber">Número de Teléfono</label>
                <input type="tel" id="phoneNumber" name="phoneNumber" required>
            </div>
            <div class="form-group">
                <input type="submit" value="Reservar Cita">
            </div>
        </form>
    </div>

    <!-- Incluir jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
        const { jsPDF } = window.jspdf;

        // Fechas disponibles para la reserva
        const availableDates = [
            '2025-04-05',  // 5 de abril
            '2025-04-06',  // 6 de abril
            '2025-04-07',  // 7 de abril
            '2025-04-10',  // 10 de abril
            '2025-04-12',  // 12 de abril
        ];

        // Establecer las fechas disponibles en el input de fecha
        const dateInput = document.getElementById('date');
        const today = new Date();
        const formattedToday = today.toISOString().split('T')[0];

        // Establecer la fecha mínima como hoy
        dateInput.setAttribute('min', formattedToday);

        // Función para establecer las fechas disponibles
        function setAvailableDates() {
            // Convertimos el array de fechas disponibles en una lista de fechas en formato ISO
            availableDates.forEach(date => {
                let option = document.createElement('option');
                option.value = date;
                option.text = date;
                // Aquí puedes poner una lógica para generar las horas disponibles para ese día
            });
        }

        // Validar si la fecha seleccionada está en las fechas disponibles
        function validateDate(selectedDateTime) {
            const selectedDate = selectedDateTime.split("T")[0]; // Obtener solo la fecha (yyyy-mm-dd)

            if (!availableDates.includes(selectedDate)) {
                alert("La fecha seleccionada no está disponible. Por favor, elige otra fecha.");
                return false;
            }
            return true;
        }

        // Función para generar el PDF y descargarlo
        document.getElementById('reservationForm').addEventListener('submit', function (event) {
            event.preventDefault();

            const date = document.getElementById('date').value;
            const name = document.getElementById('name').value;
            const service = document.getElementById('service').value;
            const phoneNumber = document.getElementById('phoneNumber').value;

            // Validar si la fecha seleccionada está disponible
            if (!validateDate(date)) {
                return; // Si la fecha no es válida, no continuar con la generación del PDF
            }

            // Crear un nuevo documento PDF
            const doc = new jsPDF();

            // Título del PDF
            doc.text('Comprobante de Reserva', 20, 20);
            doc.text(`Nombre: ${name}`, 20, 40);
            doc.text(`Servicio: ${service}`, 20, 50);
            doc.text(`Fecha y Hora: ${date}`, 20, 60);
            doc.text(`Número de Teléfono: ${phoneNumber}`, 20, 70);

            // Número de contacto para WhatsApp
            const contactNumber = '+1234567890';  // Tu número de WhatsApp (puedes cambiarlo aquí)
            doc.text(`Para confirmar o para dudas, contacta al número: ${contactNumber}`, 20, 90);
            doc.text(`Envía una captura por WhatsApp al número arriba indicado.`, 20, 100);

            // Descargar el PDF automáticamente al hac er clic en "Reservar Cita"
            doc.save('comprobante_reserva.pdf');
        });

        // Llamamos a la función para configurar las fechas disponibles
        setAvailableDates();
    </script>

</body>

</html>
